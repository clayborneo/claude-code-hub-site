<style>
/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.5;position:relative;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:var(--bg-texture);opacity:var(--texture-opacity,.5);z-index:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--font-mono,ui-monospace,Menlo,monospace);font-size:.9em;background:var(--code-bg);color:var(--ink);padding:.1em .35em;border-radius:4px}
pre{background:var(--code-bg);padding:.8em 1em;border-radius:var(--radius);overflow:auto}
pre code{background:none;padding:0}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0 0 .4em;font-weight:var(--display-weight,600);letter-spacing:var(--display-tracking,0)}
hr{border:0;border-top:1px solid var(--border);margin:1em 0}
blockquote{margin:.6em 0;padding:.3em 1em;border-left:3px solid var(--accent);color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.93em}
th,td{text-align:left;padding:.35em .6em;border-bottom:1px solid var(--border);vertical-align:top}
ul,ol{padding-left:1.3em;margin:.4em 0}
li{margin:.15em 0}
input[type=checkbox]{accent-color:var(--accent)}
[hidden]{display:none!important}
.card,.res,details.panel,.stat,.col h2 b,.sbig,#lock form,.q input,.modal,.qadd textarea,.colname input{color:var(--ink)}
button,input,select,textarea{font:inherit}
.btn{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}
.btn.danger{color:#b3261e;border-color:#b3261e55}
.btn.small{padding:3px 10px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 20px 60px}

/* ---------- header ---------- */
header{position:relative;z-index:2;display:flex;align-items:center;gap:18px;padding:16px 20px;max-width:1240px;margin:0 auto;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:1.35rem;font-weight:700;letter-spacing:var(--display-tracking,0);color:var(--ink);display:flex;align-items:center;gap:10px}
.brand .anole{width:30px;height:30px;border-radius:8px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
nav a{padding:6px 12px;border-radius:999px;color:var(--ink);font-weight:500;border:1px solid transparent}
nav a.on,nav a:hover{background:var(--surface);border-color:var(--border);text-decoration:none}
.live{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.live.on{color:var(--on-accent,#fff);background:var(--accent-2);border-color:var(--accent-2)}
.q{display:flex;gap:8px;flex:1 1 220px;max-width:420px}
.q input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem}
.q input:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}

/* ---------- unlock ---------- */
#lock{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50}
#lock form{width:min(92vw,380px);padding:32px 28px;background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) + 6px);box-shadow:var(--shadow)}
#lock h1{font-size:1.6rem}
#lock p{color:var(--muted);margin:.2em 0 1.2em}
#lock input{width:100%;padding:11px 13px;font:inherit;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--ink)}
#lock button{margin-top:12px;width:100%;padding:11px;font:inherit;font-weight:700;border:0;border-radius:var(--radius);background:var(--accent);color:var(--on-accent,#fff);cursor:pointer}
#lock .err{color:#c0392b;min-height:1.3em;margin-top:8px;font-size:.9em}

/* ---------- overview ---------- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0 22px}
.hero h1{font-size:clamp(1.9rem,4vw,3rem);margin:0}
.hero .sub{color:var(--muted)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:1.4rem;font-family:var(--font-display);line-height:1}
.stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.pcard{position:relative;overflow:hidden;display:block;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:18px 18px 16px;min-height:190px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;font-family:var(--font-body)}
.pcard::before{content:"";position:absolute;inset:0;background:var(--bg-texture);opacity:var(--texture-opacity,.5);pointer-events:none}
.pcard>*{position:relative}
.pcard:hover{transform:translateY(-3px);text-decoration:none;box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}
.pcard h3{font-size:1.35rem;margin:0 0 4px;color:var(--ink)}
.pcard .desc{color:var(--muted);font-size:.92em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0 12px}
.chip{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font-family:var(--font-body)}
.chip.s-tbd,.chip.s-docs{opacity:.7}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--ink) 12%,transparent);margin:8px 0 6px}
.bar i{display:block;height:100%}
.bar .todo{background:var(--accent)}.bar .doing{background:var(--accent-2)}.bar .done{background:color-mix(in srgb,var(--ink) 40%,transparent)}
.meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.pcard .stub{font-style:italic;color:var(--muted);font-size:.9em}
.section-title{margin:34px 0 12px;display:flex;align-items:baseline;gap:12px}
.section-title h2{margin:0;font-size:1.3rem}
.section-title span{color:var(--muted);font-size:.9em}

/* ---------- board ---------- */
.phead{margin:14px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead h1{font-size:clamp(2rem,5vw,3.4rem);margin:0}
.phead .desc{max-width:70ch;color:var(--muted);margin:.3em 0 .6em}
.phead .path{font-size:.8rem;color:var(--muted)}
.phead .path code{font-size:.85em}
.board{display:flex;gap:14px;margin:6px 0 30px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 300px;max-width:300px;background:color-mix(in srgb,var(--surface) 65%,transparent);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:10px;min-height:160px;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px;color:var(--muted);gap:6px}
.col h2 .colname{flex:1;cursor:text;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col h2 b{font-family:var(--font-body);font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 9px;font-size:.8rem}
.col h2 .menu{background:none;border:0;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:0 4px;line-height:1}
.colname input{width:100%;font:inherit;text-transform:none;letter-spacing:0;background:var(--surface);border:1px solid var(--accent);border-radius:6px;padding:2px 6px}
.cards{flex:1;min-height:40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;margin-bottom:9px;box-shadow:var(--shadow);font-size:.95em;transform:var(--card-tilt,none);cursor:grab;position:relative}
.card:nth-child(even){transform:var(--card-tilt-alt,none)}
.card:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--border))}
.card.dragging{opacity:.4}
.card .tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.card .tag,.tag{font-size:.72rem;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent-2) 22%,transparent);border:1px solid color-mix(in srgb,var(--accent-2) 55%,transparent);font-family:var(--font-body);font-style:normal}
.card .due{font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-family:var(--font-body)}
.card .due.soon{border-color:#d9a400;background:#d9a40022}
.card .due.late{border-color:#c0392b;background:#c0392b22;color:#c0392b}
.card .note-ind{font-size:.75rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{margin:0}
.col.done .card{opacity:.72}
.col.done .card p{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.col.dropped{border-style:dashed}
.col.dropped .card{opacity:.5;font-style:italic}
.placeholder{height:44px;border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:var(--radius);margin-bottom:9px}
.empty{color:var(--muted);font-size:.88em;padding:8px 6px;font-style:italic}
.qadd{margin-top:4px}
.qadd button{width:100%;text-align:left;background:none;border:1px dashed var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--muted);cursor:pointer}
.qadd button:hover{color:var(--ink);border-color:var(--accent)}
.qadd textarea{width:100%;min-height:58px;padding:8px 10px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--surface);resize:vertical}
.qadd .row{display:flex;gap:6px;margin-top:6px}
.addcol{flex:0 0 220px;align-self:flex-start;background:none;border:1px dashed var(--border);border-radius:calc(var(--radius) + 4px);padding:12px;color:var(--muted);cursor:pointer;text-align:left}
.addcol:hover{color:var(--ink);border-color:var(--accent)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
details.panel{background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);padding:0;box-shadow:var(--shadow)}
details.panel summary{cursor:pointer;padding:12px 16px;font-family:var(--font-display);font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"+";color:var(--muted);font-family:var(--font-body)}
details.panel[open] summary::after{content:"−"}
details.panel .body{padding:0 16px 16px;font-size:.95em}
details.panel.wide{grid-column:1/-1}
.log-entry{border-top:1px dashed var(--border);padding:10px 0}
.log-entry h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 4px;font-family:var(--font-body)}
.hint{font-size:.82rem;color:var(--muted);margin:-8px 0 16px}
.hint code{font-size:.85em}
.ro{background:#d9a40022;border:1px solid #d9a40088;border-radius:var(--radius);padding:8px 12px;font-size:.88em;margin:0 0 14px}

/* ---------- modal / toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:grid;place-items:center;padding:20px}
.modal{width:min(94vw,560px);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius) + 6px);box-shadow:0 20px 50px -20px rgba(0,0,0,.6);padding:22px 24px}
.modal h2{font-size:1.3rem;margin-bottom:12px}
.modal label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 4px}
.modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--ink)}
.modal textarea{min-height:110px;resize:vertical}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.modal .actions .left{margin-right:auto}
.modal p.help{color:var(--muted);font-size:.9em;margin:.4em 0}
#toast{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:.9rem;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);animation:fade 3.2s forwards}
#toast div.err{background:#b3261e;color:#fff;animation-duration:6s}
@keyframes fade{0%{opacity:0;transform:translateY(6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ---------- search ---------- */
.search h1{font-size:2rem}
.sbig{width:100%;padding:14px 18px;font:inherit;font-size:1.15rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink);margin:6px 0 18px}
.res{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.res .where{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.res .where a{font-weight:700;color:var(--ink)}
.res .line{margin:2px 0;font-size:.95em;white-space:pre-wrap;word-break:break-word}
mark{background:color-mix(in srgb,var(--accent-2) 55%,transparent);color:inherit;padding:0 2px;border-radius:2px}
.nores{color:var(--muted);font-style:italic}

/* ---------- prose ---------- */
.prose h2{font-size:1.25rem;margin-top:1em}
.prose h3{font-size:1.05rem;margin-top:.9em}
.prose p{margin:.45em 0}
.prose li.task{list-style:none;margin-left:-1.2em}
.prose li.task input{margin-right:6px}

<script>
(() => {
  // ================= config =================
  const CFG = { repo: 'clayborneo/claude-code-hub', branch: 'main', dir: 'content/scratchpads',
                api: localStorage.getItem('hub.api') || 'https://api.github.com' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const state = { pw: null, data: null, keys: new Map(), token: null, live: false, docs: new Map() };
  const toast = (msg, err) => { const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err'; $('#toast').appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 3300); };

  // ================= crypto =================
  const enc = new TextEncoder(), dec = new TextDecoder();
  async function deriveKey(pw, salt, usages) {
    const hex = [...salt].map(b => b.toString(16).padStart(2,'0')).join('') + usages.join();
    if (state.keys.has(hex)) return state.keys.get(hex);
    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:310000, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, usages);
    state.keys.set(hex, key); return key;
  }
  async function decryptBuf(buf) {
    const b = new Uint8Array(buf); const key = await deriveKey(state.pw, b.slice(0,16), ['decrypt']);
    return crypto.subtle.decrypt({ name:'AES-GCM', iv:b.slice(16,28) }, key, b.slice(28));
  }
  // the GitHub token is kept in localStorage, encrypted with the site password
  async function storeToken(tok) {
    if (!tok) { localStorage.removeItem('hub.tok'); return; }
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(state.pw, salt, ['encrypt']);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(tok)));
    const b64 = a => btoa(String.fromCharCode(...a));
    localStorage.setItem('hub.tok', JSON.stringify({ salt:b64(salt), iv:b64(iv), ct:b64(ct) }));
  }
  async function loadToken() {
    try { const j = JSON.parse(localStorage.getItem('hub.tok') || 'null'); if (!j) return null;
      const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      const key = await deriveKey(state.pw, u(j.salt), ['decrypt']);
      return dec.decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:u(j.iv) }, key, u(j.ct)));
    } catch (e) { return null; }
  }

  // ================= GitHub client =================
  const gh = {
    headers() { return { 'Authorization': 'Bearer ' + state.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; },
    url(name) { return `${CFG.api}/repos/${CFG.repo}/contents/${CFG.dir}${name ? '/' + encodeURIComponent(name) : ''}`; },
    async list() { const r = await fetch(this.url() + `?ref=${CFG.branch}`, { headers: this.headers() }); if (!r.ok) throw new Error('GitHub ' + r.status); return r.json(); },
    async get(name) { const r = await fetch(this.url(name) + `?ref=${CFG.branch}`, { headers: this.headers(), cache:'no-store' }); if (!r.ok) throw new Error('GitHub ' + r.status); const j = await r.json();
      return { sha: j.sha, text: dec.decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')), c => c.charCodeAt(0))) }; },
    async put(name, text, sha, message) {
      const bytes = enc.encode(text); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      const r = await fetch(this.url(name), { method:'PUT', headers: { ...this.headers(), 'Content-Type':'application/json' },
        body: JSON.stringify({ message, content: btoa(bin), sha, branch: CFG.branch }) });
      if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
      return (await r.json()).content.sha;
    }
  };

  // ================= markdown model (mirrors build.py) =================
  const SECTION_KEYS = [['what',/what this is|overview|what it is/],['state',/project state|current state|status/],['threads',/open threads|todo|to-do|next steps/],['decisions',/decisions|insights/],['gotchas',/gotcha/],['crosschecks',/cross-?check/],['log',/^log|\blog\b/],['imported',/imported from auto-memory/],['people',/^clay\b|who you are working with|how we work|working agreements/],['index',/project index/],['protocol',/how to use this file|protocol/],['recurring',/recurring/],['site',/command center site/]];
  const classify = h => { const t = h.replace(/[^\w\s\-&/]/g,'').trim().toLowerCase(); for (const [k, rx] of SECTION_KEYS) if (rx.test(t)) return k; return 'other'; };
  const DEFAULT_COLUMNS = ['To do', 'In progress', 'Done', 'Deprecated'];
  const colState = name => /deprecat|dropped|cancel|won.?t|archive|parked/i.test(name) ? 'dropped' : /done|complete|shipped|finished/i.test(name) ? 'done' : /progress|doing|active|now|current/i.test(name) ? 'doing' : 'todo';
  const STATE_CHAR = { todo:' ', doing:'~', done:'x', dropped:'-' };
  const STATE_OF = { ' ':'todo', '~':'doing', '>':'doing', '/':'doing', 'x':'done', 'X':'done', '-':'dropped' };
  const DEFAULT_COL_FOR = { todo:'To do', doing:'In progress', done:'Done', dropped:'Deprecated' };
  let cardSeq = 0;

  function parseDoc(raw) {
    const lines = raw.split('\n'); const sections = []; let cur = null; const pre = [];
    lines.forEach((line, i) => {
      if (line.startsWith('## ')) { cur = { heading: line.slice(3).trim(), key: classify(line.slice(3)), start: i, end: lines.length, lines: [] }; if (sections.length > 1 || (sections.length === 1)) sections[sections.length-1].end = i; sections.push(cur); }
      else if (!cur) pre.push(line); else cur.lines.push(line);
    });
    const title = (pre.find(l => l.startsWith('# ')) || '# ').slice(2).replace(/\s*[—–-]\s*(Project Brain|Command Center).*$/, '').trim();
    const th = sections.find(s => s.key === 'threads');
    const board = { heading: th ? th.heading : 'Open Threads (live TODO)', columns: [], cards: [], loose: {}, present: !!th };
    if (th) {
      let col = null, card = null;
      for (const line of th.lines) {
        const h = line.match(/^###\s+(.*)$/);
        if (h) { col = h[1].trim(); if (!board.columns.includes(col)) board.columns.push(col); card = null; continue; }
        const m = line.match(/^[-*]\s+\[(.)\]\s+(.*)$/);          // top-level cards only; indented checklists are notes
        if (m) { const text = m[2].trim(); const st = STATE_OF[m[1]] || 'todo'; const due = (text.match(/(?:^|\s)@due:(\d{4}-\d{2}-\d{2})(?=\s|$)/) || [])[1] || '';
          const tags = [...text.matchAll(/(?:^|\s)@([\w\-:]+)/gu)].map(x => x[1]).filter(t => !t.startsWith('due:'));
          card = { id: 'c' + (++cardSeq), title: text.replace(/(?:^|\s)@[\w\-:]+(?=\s|$)/gu, ' ').replace(/\s+/g, ' ').trim(), state: st, due, tags: [...new Set(tags)], notes: [], column: col || DEFAULT_COL_FOR[st] };
          board.cards.push(card); }
        else if (card && /^\s+\S/.test(line)) card.notes.push(line.replace(/^ {0,2}/, '').replace(/\s+$/, ''));   // keep relative indentation
        else if (line.trim()) { const k = col || ''; (board.loose[k] = board.loose[k] || []).push(line); card = null; }  // prose kept verbatim
      }
      for (const c of board.cards) { c.notes = c.notes.join('\n'); if (!board.columns.length && !DEFAULT_COLUMNS.includes(c.column)) c.column = 'To do'; }
      if (!board.columns.length) board.columns = [...DEFAULT_COLUMNS];
      for (const c of board.cards) if (!board.columns.includes(c.column)) board.columns.push(c.column);
    }
    const logSec = sections.find(s => s.key === 'log'); const log = [];
    if (logSec) { let e = null; for (const l of logSec.lines) { const m = l.match(/^###\s+(.*)$/); if (m) { e = { date: m[1].trim(), md: [] }; log.push(e); } else if (e) e.md.push(l); } log.forEach(e => e.md = e.md.join('\n').trim()); }
    const what = (sections.find(s => s.key === 'what') || { lines: [] }).lines.join('\n').trim();
    return { raw, title, sections: sections.map(s => ({ ...s, md: s.lines.join('\n').trim() })), board, log, what: /^_.*_$/.test(what) ? '' : what, counts: countCards(board) };
  }
  function countCards(board) { const c = { todo:0, doing:0, done:0, dropped:0 }; for (const k of board.cards) c[colState(k.column)]++; return c; }
  function serializeBoard(board) {
    const out = []; const loose = board.loose || {};
    if (loose['']) out.push(...loose[''], '');
    for (const col of board.columns) {
      out.push(`### ${col}`);
      if (loose[col]) out.push(...loose[col]);
      for (const c of board.cards.filter(k => k.column === col)) {
        const bits = [c.title.trim()]; if (c.due) bits.push('@due:' + c.due); for (const t of c.tags) bits.push('@' + t);
        out.push(`- [${STATE_CHAR[colState(col)]}] ${bits.join(' ')}`);
        for (const n of (c.notes || '').split('\n')) if (n.trim()) out.push('  ' + n.replace(/\s+$/, ''));
      }
      out.push('');
    }
    return out.join('\n').replace(/\n{3,}/g, '\n\n').replace(/\n+$/, '') + '\n';
  }
  function applyBoard(doc) {
    const lines = doc.raw.split('\n'); const th = doc.sections.find(s => s.key === 'threads');
    const body = serializeBoard(doc.board).replace(/\n+$/, '').split('\n');
    let newLines;
    if (th) newLines = [...lines.slice(0, th.start + 1), ...body, ...(th.end < lines.length ? [''] : []), ...lines.slice(th.end)];
    else { if (!doc.board.columns.length) doc.board.columns = [...DEFAULT_COLUMNS]; const idx = lines.findIndex((l, i) => i > 0 && l.startsWith('## ') && /decisions|gotcha|log/i.test(l)); const block = ['## Open Threads (live TODO)', ...serializeBoard(doc.board).replace(/\n+$/, '').split('\n'), '']; newLines = idx >= 0 ? [...lines.slice(0, idx), ...block, ...lines.slice(idx)] : [...lines, '', ...block]; }
    let s = newLines.join('\n'); if (!s.endsWith('\n')) s += '\n';
    return s;
  }

  // ================= docs store =================
  function docFrom(meta, raw, sha) { const p = parseDoc(raw); return { ...meta, ...p, sha, mirror: meta.mirror || (meta.id === 'hub' ? '_hub.md' : meta.id + '.md') }; }
  function loadStatic() {
    state.docs.clear();
    for (const p of state.data.projects) if (!p.stub) state.docs.set(p.id, docFrom(p, p.raw, null));
    if (state.data.hub) state.docs.set('hub', docFrom({ ...state.data.hub, id: 'hub', theme: 'atlas' }, state.data.hub.raw, null));
  }
  async function loadLive() {
    const files = await gh.list(); const byName = new Map(files.map(f => [f.name, f]));
    const metas = [...state.data.projects.map(p => ({ ...p })), state.data.hub ? { ...state.data.hub, id: 'hub', theme: 'atlas', mirror: '_hub.md' } : null].filter(Boolean);
    await Promise.all(metas.map(async m => {
      const name = m.mirror || (m.id === 'hub' ? '_hub.md' : m.id + '.md');
      if (!byName.has(name)) return;
      const { sha, text } = await gh.get(name);
      state.docs.set(m.id, docFrom({ ...m, stub: false, mirror: name }, text, sha));
    }));
    state.live = true; $('#livebadge').textContent = 'live'; $('#livebadge').classList.add('on');
  }
  // Saves are queued per document so rapid edits never race on the same sha. On a stale sha
  // the latest file is fetched and the in-memory board (which owns the Open Threads section)
  // is re-applied on top of it, once.
  const saveQueues = new Map();
  function saveDoc(doc, message) {
    const prev = saveQueues.get(doc.id) || Promise.resolve(true);
    const next = prev.then(() => doSave(doc, message, true)).catch(() => false);
    saveQueues.set(doc.id, next); return next;
  }
  async function doSave(doc, message, retry) {
    if (!state.live) { toast('Read-only. Add a GitHub token in Settings to save changes.', true); return false; }
    const raw = applyBoard(doc);
    try {
      const sha = await gh.put(doc.mirror, raw, doc.sha, message);
      // keep the live board object (the DOM's closures point at it); refresh raw, sha and section offsets
      Object.assign(doc, docFrom(doc, raw, sha), { board: doc.board, counts: countCards(doc.board) }); toast('Saved to GitHub');
      return true;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && retry) {
        const { sha, text } = await gh.get(doc.mirror); Object.assign(doc, docFrom(doc, text, sha), { board: doc.board, counts: countCards(doc.board) });
        toast('File changed elsewhere; re-applying your edit on the latest version.'); return doSave(doc, message, false);
      }
      toast('Save failed: ' + e.message + '. Reloading this board.', true);
      try { const { sha, text } = await gh.get(doc.mirror); Object.assign(doc, docFrom(doc, text, sha)); } catch (_) {}
      route(); return false;
    }
  }

  // ================= unlock =================
  async function tryUnlock(pw) {
    state.pw = pw;
    const res = await fetch('data.enc', { cache:'no-store' }); if (!res.ok) throw new Error('data.enc not found');
    state.data = JSON.parse(dec.decode(await decryptBuf(await res.arrayBuffer())));
    sessionStorage.setItem('hub.pw', pw);
    loadStatic();
    $('#lock').hidden = true; $('#hdr').hidden = false; $('#app').hidden = false;
    route();
    state.token = await loadToken();
    if (state.token) { try { await loadLive(); route(); } catch (e) { toast('GitHub connection failed (' + e.message + '). Showing the last published snapshot.', true); } }
  }
  $('#lockform').addEventListener('submit', async e => { e.preventDefault(); $('#lockerr').textContent = '';
    try { await tryUnlock($('#pw').value); } catch (err) { $('#lockerr').textContent = 'Wrong password (or the site has not been built yet).'; } });

  // ================= tiny markdown =================
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)]|$)/g, '$1<em>$2</em>').replace(/(^|[\s(])\*([^*]+)\*(?=[\s.,;:)]|$)/g, '$1<em>$2</em>')
      .replace(/\[\[([^\]]+)\]\]/g, '<em>$1</em>').replace(/@([\w-]+(?::[\w-]+)?)/g, '<span class="tag">@$1</span>');
  }
  function md(src) {
    const lines = src.split('\n'); const out = []; let i = 0;
    while (i < lines.length) {
      let l = lines[i]; if (!l.trim()) { i++; continue; }
      if (/^```/.test(l)) { const buf=[]; i++; while (i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue; }
      if (/^#{1,4} /.test(l)) { const n=Math.min(l.match(/^#+/)[0].length+1,4); out.push(`<h${n}>${inline(l.replace(/^#+\s*/,''))}</h${n}>`); i++; continue; }
      if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^\|/.test(l)) { const rows=[]; while (i<lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]); const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim())); const body=rows.filter(r=>!/^\|\s*-/.test(r));
        out.push('<table><thead><tr>'+cells(body[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+body.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'); continue; }
      if (/^>/.test(l)) { const buf=[]; while (i<lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,'')); out.push('<blockquote>'+inline(buf.join(' '))+'</blockquote>'); continue; }
      if (/^\s*([-*]|\d+\.) /.test(l)) { const ordered=/^\s*\d+\./.test(l); const raw=[];
        while (i<lines.length && (/^\s*([-*]|\d+\.) /.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && raw.length))) { const cur=lines[i]; if (/^\s*([-*]|\d+\.) /.test(cur)) raw.push(cur.replace(/^\s*([-*]|\d+\.)\s+/,'')); else raw[raw.length-1]+=' '+cur.trim(); i++; }
        const items=raw.map(t=>{ const m=t.match(/^\[(.)\]\s+([\s\S]*)$/); if (m) { const st=m[1]; return `<li class="task"><input type="checkbox" disabled ${st.toLowerCase()==='x'?'checked':''}> ${st==='~'?'<em>(in progress)</em> ':st==='-'?'<em>(dropped)</em> ':''}${inline(m[2])}</li>`; } return '<li>'+inline(t)+'</li>'; });
        out.push((ordered?'<ol>':'<ul>')+items.join('')+(ordered?'</ol>':'</ul>')); continue; }
      const buf=[]; while (i<lines.length && lines[i].trim() && !/^(#{1,4} |```|---|\||>|\s*([-*]|\d+\.) )/.test(lines[i])) buf.push(lines[i++]);
      out.push('<p>'+inline(buf.join(' '))+'</p>');
    }
    return out.join('\n');
  }

  // ================= helpers =================
  const statusClass = s => 's-' + (s||'tbd').split(/[\s/]/)[0].toLowerCase();
  const setTheme = t => document.documentElement.setAttribute('data-theme', t || 'atlas');
  const setNav = k => document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === k));
  const fmtCounts = c => `${c.todo} to do · ${c.doing} in progress · ${c.done} done${c.dropped ? ' · ' + c.dropped + ' dropped' : ''}`;
  const today = () => new Date().toISOString().slice(0,10);
  const dueClass = d => !d ? '' : d < today() ? 'late' : (new Date(d) - new Date(today())) / 864e5 <= 3 ? 'soon' : '';
  const dueLabel = d => { if (!d) return ''; const diff = Math.round((new Date(d) - new Date(today())) / 864e5); return diff < 0 ? `${-diff}d overdue` : diff === 0 ? 'today' : diff === 1 ? 'tomorrow' : diff <= 14 ? `in ${diff}d` : d; };
  const allProjects = () => state.data.projects.map(p => state.docs.get(p.id) ? { ...p, ...state.docs.get(p.id) } : { ...p, counts: { todo:0, doing:0, done:0, dropped:0, ...(p.counts||{}) } });

  // ================= views =================
  function viewHome() {
    setTheme('atlas'); setNav('home'); document.title = 'Command Center';
    const ps = allProjects();
    const tot = ps.reduce((a,p)=>({todo:a.todo+p.counts.todo,doing:a.doing+p.counts.doing,done:a.done+p.counts.done}),{todo:0,doing:0,done:0});
    const active = ps.filter(p => /active|meta/.test(p.status)), rest = ps.filter(p => !/active|meta/.test(p.status));
    const card = p => { const n = p.counts.todo + p.counts.doing + p.counts.done || 1; const late = (p.board ? p.board.cards : []).filter(c => c.due && c.due < today() && !/done|dropped/.test(colState(c.column))).length;
      return `<a class="pcard" data-theme="${p.theme}" href="#/p/${encodeURIComponent(p.id)}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h3>${esc(p.title)}</h3><span class="chip ${statusClass(p.status)}">${esc(p.status||'tbd')}</span></div>
        <div class="desc">${esc(p.desc || p.what || '')}</div>
        ${p.stub ? '<div class="stub">No scratchpad yet. Created on the first real session.</div>' :
        `<div class="bar"><i class="todo" style="width:${100*p.counts.todo/n}%"></i><i class="doing" style="width:${100*p.counts.doing/n}%"></i><i class="done" style="width:${100*p.counts.done/n}%"></i></div>
        <div class="meta"><span>${fmtCounts(p.counts)}${late ? ` · <span style="color:#c0392b">${late} overdue</span>` : ''}</span><span>${p.last_log ? 'log ' + esc(p.last_log) : ''}</span></div>`}</a>`; };
    $('#app').innerHTML = `
      <div class="hero"><div><h1>Projects</h1><div class="sub">${state.live ? 'Live from GitHub. Edits here sync to the Markdown files.' : 'Snapshot built ' + esc(state.data.generated.replace('T',' ')) + '.'}</div></div>
        <div class="stats"><div class="stat"><b>${ps.filter(p=>!p.stub).length}</b><span>scratchpads</span></div><div class="stat"><b>${tot.todo}</b><span>to do</span></div><div class="stat"><b>${tot.doing}</b><span>in progress</span></div><div class="stat"><b>${tot.done}</b><span>done</span></div></div></div>
      <div class="grid">${active.map(card).join('')}</div>
      <div class="section-title"><h2>Everything else</h2><span>paused, folded, tbd, docs only</span></div>
      <div class="grid">${rest.map(card).join('')}</div>`;
  }

  const panel = (title, html, wide) => `<details class="panel${wide?' wide':''}" ${wide?'open':''}><summary>${esc(title)}</summary><div class="body prose">${html}</div></details>`;

  function renderBoard(doc) {
    const b = doc.board; const ro = !state.live;
    const cardHtml = c => { const n = (c.notes||'').split('\n')[0];
      return `<div class="card" draggable="${!ro}" data-card="${c.id}"><p>${inline(c.title)}</p>
        ${(c.due || c.tags.length) ? `<div class="tags">${c.due ? `<span class="due ${dueClass(c.due)}" title="${c.due}">${esc(dueLabel(c.due))}</span>` : ''}${c.tags.map(t=>'<span class="tag">@'+esc(t)+'</span>').join('')}</div>` : ''}
        ${n ? `<div class="note-ind">${esc(n)}</div>` : ''}</div>`; };
    return `<div class="board" id="board">${b.columns.map(col => { const cs = b.cards.filter(c => c.column === col);
      return `<div class="col ${colState(col)}" data-col="${esc(col)}"><h2><span class="colname" title="Click to rename">${esc(col)}</span><b>${cs.length}</b>${ro ? '' : '<button class="menu" title="Column menu">⋯</button>'}</h2>
        <div class="cards">${cs.map(cardHtml).join('') || '<div class="empty">Nothing here.</div>'}</div>
        ${ro ? '' : '<div class="qadd"><button>+ Add a card</button></div>'}</div>`; }).join('')}
      ${ro ? '' : '<button class="addcol">+ Add a column</button>'}</div>`;
  }

  function viewProject(id, openSection) {
    id = decodeURIComponent(id);
    const doc = state.docs.get(id); const meta = state.data.projects.find(p => p.id === id) || {};
    if (!doc) { setTheme(meta.theme || 'atlas'); $('#app').innerHTML = `<div class="phead"><div><h1>${esc(meta.title || id)}</h1><div class="desc">${esc(meta.desc||'')}</div><div class="path">No scratchpad yet. It gets created the first time Claude works in this folder.</div></div></div>`; return; }
    setTheme(doc.theme); setNav(''); document.title = doc.title + ' · Command Center';
    const others = doc.sections.filter(s => !['threads','log','what','imported'].includes(s.key));
    const panels = others.map(s => panel(s.heading.replace(/^[^\w]+/,''), md(s.md)));
    if (doc.log.length) panels.push(panel('Log', doc.log.map(e => `<div class="log-entry"><h4>${esc(e.date)}</h4>${md(e.md)}</div>`).join(''), true));
    const imp = doc.sections.find(s => s.key === 'imported'); if (imp) panels.push(`<details class="panel wide"><summary>Imported from auto-memory (raw seed, to be pruned)</summary><div class="body prose">${md(imp.md)}</div></details>`);
    $('#app').innerHTML = `
      <div class="phead"><div><span class="chip ${statusClass(doc.status)}">${esc(doc.status||'tbd')}</span><h1>${esc(doc.title)}</h1>
        <div class="desc">${doc.what ? md(doc.what) : esc(doc.desc||'')}</div>
        <div class="path">Source: <code>${esc(doc.path || doc.mirror)}</code>${doc.updated ? ' · updated ' + doc.updated : ''}</div></div></div>
      ${state.live ? '' : '<div class="ro">Read-only snapshot. Open Settings and add a GitHub token to edit the board here; changes sync to the Markdown files.</div>'}
      ${renderBoard(doc)}
      <div class="hint">Cards are the scratchpad's <em>Open Threads</em>. Drag between columns, click a card to edit, click a column name to rename it. Everything you change here is written back to the Markdown, so Claude sees it next session.</div>
      <div class="panels">${panels.join('')}</div>`;
    wireBoard(doc);
    if (openSection) { const d=[...document.querySelectorAll('details.panel')].find(x=>x.querySelector('summary').textContent.trim().toLowerCase().startsWith(openSection.toLowerCase())); if (d) { d.open = true; d.scrollIntoView({behavior:'smooth'}); } }
  }

  function viewHub() {
    const doc = state.docs.get('hub'); setTheme('atlas'); setNav('hub'); document.title = 'Hub · Command Center';
    if (!doc) { $('#app').innerHTML = '<p>No hub scratchpad.</p>'; return; }
    const panels = doc.sections.filter(s=>!['threads','log','index'].includes(s.key)).map(s=>panel(s.heading.replace(/^[^\w]+/,''), md(s.md)));
    if (doc.log.length) panels.push(panel('Log', doc.log.map(e=>`<div class="log-entry"><h4>${esc(e.date)}</h4>${md(e.md)}</div>`).join(''), true));
    $('#app').innerHTML = `<div class="phead"><div><h1>Hub</h1><div class="desc">Cross-project threads, who Clay is, how we work, shared gotchas. Source: <code>${esc(doc.path || 'SCRATCHPAD.md')}</code></div></div></div>
      ${state.live ? '' : '<div class="ro">Read-only snapshot. Add a GitHub token in Settings to edit.</div>'}
      ${renderBoard(doc)}<div class="panels">${panels.join('')}</div>`;
    wireBoard(doc);
  }

  // ================= board interactions =================
  function wireBoard(doc) {
    const board = $('#board'); if (!board || !state.live) return;
    const b = doc.board; let dragId = null;
    const rerender = () => route();
    const save = msg => { doc.counts = countCards(b); saveDoc(doc, msg).then(ok => { if (!ok) rerender(); }); };
    const appendTo = (card, col) => { card.column = col; let last = -1; b.cards.forEach((c, i) => { if (c.column === col) last = i; }); b.cards.splice(last + 1, 0, card); };
    board.addEventListener('dragstart', e => { const el = e.target.closest('.card'); if (!el) return; dragId = el.dataset.card; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    board.addEventListener('dragend', () => { dragId = null; board.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); board.querySelectorAll('.placeholder').forEach(x => x.remove()); board.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
    board.addEventListener('dragover', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      board.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over');
      const cards = [...col.querySelectorAll('.card:not(.dragging)')]; let before = null; for (const c of cards) { const r = c.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = c; break; } }
      let ph = col.querySelector('.placeholder'); if (!ph) { ph = document.createElement('div'); ph.className = 'placeholder'; } const wrap = col.querySelector('.cards'); if (before) wrap.insertBefore(ph, before); else wrap.appendChild(ph); });
    board.addEventListener('dragleave', e => { const col = e.target.closest('.col'); if (col && !col.contains(e.relatedTarget)) { col.classList.remove('over'); col.querySelectorAll('.placeholder').forEach(x => x.remove()); } });
    board.addEventListener('drop', e => { const col = e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault();
      const ph = col.querySelector('.placeholder'); const nextEl = ph && ph.nextElementSibling && ph.nextElementSibling.classList.contains('card') ? ph.nextElementSibling.dataset.card : null;
      const card = b.cards.find(c => c.id === dragId); if (!card) return; const from = card.column; b.cards.splice(b.cards.indexOf(card), 1);
      if (nextEl) { card.column = col.dataset.col; b.cards.splice(b.cards.findIndex(c => c.id === nextEl), 0, card); } else appendTo(card, col.dataset.col);
      rerender(); save(`board: move "${card.title.slice(0,50)}" ${from === card.column ? 'within' : 'to'} ${card.column} (${doc.title})`); });
    board.addEventListener('click', e => {
      const cardEl = e.target.closest('.card'); if (cardEl) return openCardEditor(b.cards.find(c => c.id === cardEl.dataset.card));
      const name = e.target.closest('.colname'); if (name && !name.querySelector('input')) return renameColumn(name);
      const menu = e.target.closest('.menu'); if (menu) return columnMenu(menu.closest('.col').dataset.col);
      const add = e.target.closest('.qadd button'); if (add) return quickAdd(add.closest('.col').dataset.col, add.closest('.qadd'));
      if (e.target.closest('.addcol')) return addColumn();
    });
    function renameColumn(span) {
      const old = span.textContent; span.innerHTML = `<input value="${esc(old)}">`; const inp = span.querySelector('input'); inp.focus(); inp.select(); let done = false;
      const finish = ok => { if (done) return; done = true; const v = inp.value.trim(); if (ok && v && v !== old && !b.columns.includes(v)) { b.columns[b.columns.indexOf(old)] = v; b.cards.forEach(c => { if (c.column === old) c.column = v; }); rerender(); save(`board: rename column ${old} to ${v} (${doc.title})`); } else rerender(); };
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') finish(false); }); inp.addEventListener('blur', () => finish(true));
    }
    function quickAdd(col, host) {
      host.innerHTML = `<textarea placeholder="Card title (Enter to add, Shift+Enter for a new line)"></textarea><div class="row"><button class="btn primary small">Add</button><button class="btn small cancel">Cancel</button></div>`;
      const ta = host.querySelector('textarea'); ta.focus();
      const commit = () => { const t = ta.value.trim(); if (!t) return rerender(); const card = { id: 'c' + (++cardSeq), title: t.split('\n')[0], notes: t.split('\n').slice(1).join('\n'), due: '', tags: [], column: col };
        appendTo(card, col); rerender(); save(`board: add "${card.title.slice(0,50)}" to ${col} (${doc.title})`); };
      ta.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commit(); } if (ev.key === 'Escape') rerender(); });
      host.querySelector('.primary').onclick = commit; host.querySelector('.cancel').onclick = rerender;
    }
    function addColumn() { modal(`<h2>New column</h2><label>Name</label><input id="m-name" placeholder="e.g. Waiting on Clay"><p class="help">Names containing “done”, “complete”, or “shipped” behave as Done; “in progress”, “doing”, “now” as In progress; “deprecated”, “dropped”, “parked” as dropped. Anything else counts as to do.</p>
      <div class="actions"><button class="btn cancel">Cancel</button><button class="btn primary ok">Add column</button></div>`, m => { const v = m.querySelector('#m-name').value.trim(); if (!v || b.columns.includes(v)) return false; b.columns.push(v); rerender(); save(`board: add column ${v} (${doc.title})`); }); }
    function columnMenu(col) {
      const others = b.columns.filter(c => c !== col); const n = b.cards.filter(c => c.column === col).length;
      modal(`<h2>${esc(col)}</h2><p class="help">${n} card${n===1?'':'s'} in this column.</p>
        <label>Position</label><select id="m-pos">${b.columns.map((c,i)=>`<option value="${i}" ${c===col?'selected':''}>${i+1}. ${esc(c)}</option>`).join('')}</select>
        <div class="actions"><span class="left"><button class="btn danger del" ${b.columns.length<2?'disabled':''}>Delete column</button></span><button class="btn cancel">Cancel</button><button class="btn primary ok">Apply</button></div>`,
        m => { const pos = +m.querySelector('#m-pos').value; const i = b.columns.indexOf(col); if (pos !== i) { b.columns.splice(i, 1); b.columns.splice(pos, 0, col); rerender(); save(`board: reorder columns (${doc.title})`); } },
        m => { m.querySelector('.del').onclick = () => { if (n && !confirm(`Delete "${col}"? Its ${n} card(s) move to "${others[0]}".`)) return; b.cards.forEach(c => { if (c.column === col) c.column = others[0]; }); b.columns.splice(b.columns.indexOf(col), 1); closeModal(); rerender(); save(`board: delete column ${col} (${doc.title})`); }; });
    }
    function openCardEditor(card) {
      modal(`<h2>Edit card</h2>
        <label>Title</label><input id="m-title" value="${esc(card.title)}">
        <label>Column</label><select id="m-col">${b.columns.map(c=>`<option ${c===card.column?'selected':''}>${esc(c)}</option>`).join('')}</select>
        <label>Due date</label><input id="m-due" type="date" value="${esc(card.due)}">
        <label>Tags (space separated, no @)</label><input id="m-tags" value="${esc(card.tags.join(' '))}" placeholder="blocked waiting-on-clay verify">
        <label>Notes</label><textarea id="m-notes">${esc(card.notes)}</textarea>
        <div class="actions"><span class="left"><button class="btn danger del">Delete</button></span><button class="btn cancel">Cancel</button><button class="btn primary ok">Save</button></div>`,
        m => { const t = m.querySelector('#m-title').value.trim(); if (!t) return false; const newCol = m.querySelector('#m-col').value;
          Object.assign(card, { title: t, due: m.querySelector('#m-due').value, tags: m.querySelector('#m-tags').value.split(/[\s,]+/).map(x=>x.replace(/^@/,'')).filter(Boolean), notes: m.querySelector('#m-notes').value.trim() });
          if (newCol !== card.column) { b.cards.splice(b.cards.indexOf(card), 1); appendTo(card, newCol); }
          rerender(); save(`board: edit "${card.title.slice(0,50)}" (${doc.title})`); },
        m => { m.querySelector('.del').onclick = () => { if (!confirm('Delete this card?')) return; b.cards.splice(b.cards.indexOf(card), 1); closeModal(); rerender(); save(`board: delete "${card.title.slice(0,50)}" (${doc.title})`); }; });
    }
  }

  // ================= modal =================
  function modal(html, onOk, setup) {
    const host = $('#modalhost'); host.innerHTML = `<div class="backdrop"><div class="modal">${html}</div></div>`;
    const m = host.querySelector('.modal'); const first = m.querySelector('input,textarea,select'); if (first) setTimeout(() => first.focus(), 30);
    host.querySelector('.backdrop').addEventListener('click', e => { if (e.target.classList.contains('backdrop')) closeModal(); });
    m.querySelectorAll('.cancel').forEach(x => x.onclick = closeModal);
    const ok = m.querySelector('.ok'); if (ok) ok.onclick = () => { if (onOk(m) !== false) closeModal(); };
    m.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && ok) { e.preventDefault(); ok.click(); } });
    if (setup) setup(m);
  }
  const closeModal = () => { $('#modalhost').innerHTML = ''; };

  function openSettings() {
    modal(`<h2>GitHub connection</h2>
      <p class="help">${state.live ? 'Connected. Board edits are committed to <code>' + esc(CFG.repo) + '</code> and synced to the Markdown files on Clay\'s Mac at the next session.' : 'Read-only. Paste a fine-grained personal access token with <b>Contents: read and write</b> on the private repo <code>' + esc(CFG.repo) + '</code> to edit boards here.'}</p>
      <label>Token</label><input id="m-tok" type="password" placeholder="${state.token ? '•••••••• (saved in this browser, encrypted with the site password)' : 'github_pat_…'}">
      <p class="help">Stored only in this browser, encrypted with the site password. Create one at github.com → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Repository access: only <code>${esc(CFG.repo)}</code>. Permission: Contents, read and write.</p>
      <div class="actions"><span class="left">${state.token ? '<button class="btn danger forget">Forget token</button>' : ''}</span><button class="btn cancel">Close</button><button class="btn primary ok">Save and connect</button></div>`,
      m => { const t = m.querySelector('#m-tok').value.trim(); if (!t) return true; state.token = t; storeToken(t).then(() => loadLive()).then(() => { toast('Connected to GitHub'); route(); }).catch(e => { state.token = null; storeToken(null); toast('Could not connect: ' + e.message, true); }); },
      m => { const f = m.querySelector('.forget'); if (f) f.onclick = () => { state.token = null; state.live = false; storeToken(null); $('#livebadge').textContent = 'read-only'; $('#livebadge').classList.remove('on'); loadStatic(); closeModal(); route(); toast('Token forgotten. Back to the read-only snapshot.'); }; });
  }
  $('#settingsbtn').addEventListener('click', e => { e.preventDefault(); openSettings(); });

  // ================= search =================
  function viewSearch(q) {
    setTheme('atlas'); setNav('search'); document.title = 'Search · Command Center';
    $('#app').innerHTML = `<div class="search"><h1>Search</h1><input class="sbig" id="sq" type="search" placeholder="Anything in any scratchpad… e.g. Supabase, Melissa, deploy, break-even" value="${esc(q||'')}"><div id="sres"></div></div>`;
    const inp = $('#sq'); inp.focus(); inp.addEventListener('input', () => { history.replaceState(null,'','#/search?q='+encodeURIComponent(inp.value)); render(inp.value); });
    render(q||'');
    function render(q) {
      const box = $('#sres'); const terms = q.toLowerCase().split(/\s+/).filter(t=>t.length>1);
      if (!terms.length) { box.innerHTML = '<p class="nores">Type to search across every scratchpad, including the hub.</p>'; return; }
      const hits = [];
      for (const d of state.docs.values()) { let section = ''; d.raw.split('\n').forEach((line, n) => { if (/^## /.test(line)) section = line.replace(/^##\s*[^\w]*/,'').trim();
          const low = line.toLowerCase(); let score = 0; for (const t of terms) if (low.includes(t)) score += 1 + (low.split(t).length-1)*.1;
          if (score >= Math.min(terms.length, 2) * .99 || (terms.length === 1 && score)) hits.push({ d, section, line, n, score: score + (d.title.toLowerCase().includes(terms[0])?.5:0) }); }); }
      hits.sort((a,b)=>b.score-a.score);
      if (!hits.length) { box.innerHTML = '<p class="nores">No matches.</p>'; return; }
      const rx = new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'); const hl = s => esc(s).replace(rx, '<mark>$1</mark>');
      const grouped = new Map(); for (const h of hits.slice(0,80)) { const k=h.d.id+'::'+h.section; if(!grouped.has(k)) grouped.set(k,{d:h.d,section:h.section,lines:[]}); grouped.get(k).lines.push(h); }
      box.innerHTML = [...grouped.values()].map(g => `<div class="res"><div class="where"><a href="${g.d.id==='hub'?'#/hub':'#/p/'+encodeURIComponent(g.d.id)+(g.section?'?s='+encodeURIComponent(g.section):'')}">${esc(g.d.title)}</a>${g.section?'<span>› '+esc(g.section)+'</span>':''}</div>${g.lines.slice(0,6).map(h=>'<div class="line">'+hl(h.line.replace(/^\s*[-*]\s+/,'').slice(0,300))+'</div>').join('')}${g.lines.length>6?'<div class="line" style="color:var(--muted)">… '+(g.lines.length-6)+' more lines</div>':''}</div>`).join('');
    }
  }

  // ================= router =================
  function route() {
    if (!state.data) return;
    const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const params = new URLSearchParams(qs||'');
    if (!(path.startsWith('p/') || path === 'hub') || !document.querySelector('.board')) window.scrollTo(0,0);
    if (path.startsWith('p/')) return viewProject(path.slice(2), params.get('s'));
    if (path === 'hub') return viewHub();
    if (path === 'search') return viewSearch(params.get('q')||'');
    return viewHome();
  }
  window.addEventListener('hashchange', route);
  $('#qform').addEventListener('submit', e => { e.preventDefault(); location.hash = '#/search?q=' + encodeURIComponent($('#q').value); });
  window.__hub = { state, parseDoc, serializeBoard, applyBoard, route };
  const saved = sessionStorage.getItem('hub.pw'); if (saved) tryUnlock(saved).catch(() => sessionStorage.removeItem('hub.pw'));
})();
</script>
</body>
</html>
